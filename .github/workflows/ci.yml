name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the QA privacy scan covers every commit message
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Unit tests, every screen on phone/tablet/desktop, perf budget (relaxed for CI runners), privacy scan
      - run: npm run qa -- --ci
        env:
          QA_PRIVATE_TERMS: ${{ secrets.QA_PRIVATE_TERMS }}   # optional; unset = scan skipped
      - name: Upload QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            qa-report/*.md
            qa-report/*.png
