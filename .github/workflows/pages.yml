# Publishes the game to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    # Docs/QA-only changes don't redeploy: a redeploy changes the commit shown in-game and would
    # prompt every player with a pointless "update available".
    paths-ignore:
      - '**.md'
      - 'scripts/qa/**'
      - '.github/workflows/ci.yml'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # One self-contained page (no half-updated module caching) + version.json for "update available"
      - name: Build
        run: npm run build
      - name: Collect site files
        run: mkdir _site && cp dist/overdue.html _site/index.html && cp dist/version.json dist/sw.js _site/ && cp -r icons manifest.webmanifest _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  # Separate job (GitHub's own template): publishing in the same job as the upload raced with
  # artifact registration ("No artifacts named github-pages were found").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
